[workspace]
name = "muscle-dnam"
version = "0.2.0"
description = "Reproducible R and Python analysis of skeletal-muscle DNA methylation"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.12"
r-base = ">=4.4,<4.5"
quarto = "*"
git = "*"
r-tidyverse = "*"
"r-data.table" = "*"
r-here = "*"
r-yaml = "*"
r-readxl = "*"
r-openxlsx = "*"
r-rtsne = "*"
r-ggrepel = "*"
r-pheatmap = "*"
r-rcolorbrewer = "*"
r-plotly = "*"
r-htmlwidgets = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-patchwork = "*"
r-vegan = "*"
r-biocmanager = "*"
bioconductor-minfi = "*"
bioconductor-limma = "*"
bioconductor-dmrcate = "*"
bioconductor-missmethyl = "*"
bioconductor-clusterprofiler = "*"
"bioconductor-org.hs.eg.db" = "*"
bioconductor-genomeinfodbdata = "*"
"bioconductor-illuminahumanmethylation450kanno.ilmn12.hg19" = "*"
bioconductor-illuminahumanmethylation450kmanifest = "*"
"bioconductor-illuminahumanmethylationepicanno.ilm10b4.hg19" = "*"
bioconductor-illuminahumanmethylationepicmanifest = "*"
numpy = "*"
pandas = "*"
scipy = "*"
scikit-learn = "*"
matplotlib = "*"
seaborn = "*"
plotly = "*"
openpyxl = "*"
python-docx = "*"
pyyaml = "*"
joblib = "*"
jupyter = "*"
ipykernel = "*"
nbconvert = "*"
pytest = "*"

[tasks]
setup-bioc-data = "bash scripts/install_bioc_data.sh"
check-config = "python scripts/check_config.py"
check-r = "Rscript scripts/check_environment.R"
test = "pytest -q"
check = { depends-on = ["check-config", "check-r", "test"] }
metadata-audit = "Rscript scripts/01_metadata_audit.R"
reproduce-unsupervised = "Rscript scripts/02_reproduce_original_unsupervised.R"
reviewer-bias-check = "quarto render analysis/08_reviewer_bias_check"
unsupervised-bias-checks = "Rscript scripts/03_unsupervised_bias_checks.R"
subset-analyses = "Rscript scripts/04_subset_analyses.R"
differential-sensitivity = "Rscript scripts/05_differential_confounder_sensitivity.R"
metadata-classifier = "python python/metadata_classifier.py && Rscript scripts/06_plot_metadata_classifier.R"
patient-aware-ml = "python python/patient_aware_ml.py"
plot-patient-aware-ml = "Rscript scripts/10_plot_patient_aware_ml.R"
render-manuscript-report = "quarto render analysis/09_reports/manuscript_analysis.qmd --output-dir ../../reports/manuscript_analysis"
render-revision-report = "quarto render analysis/09_reports/juliane_revision.qmd --output-dir ../../reports/reviewer_revision"
render-metadata-report = "quarto render analysis/08_reviewer_bias_check/00_metadata_audit.qmd --output-dir ../../reports/reviewer_revision"
tsne-direct = "Rscript scripts/07_tsne_direct_full_matrix.R"
figure-manifest = "python scripts/08_build_output_manifest.py"
annotate-pc-loadings = "Rscript scripts/09_annotate_pc_loadings.R"
build-revision-documents = "python scripts/11_build_revision_documents.py"
package-revision = "python scripts/12_package_revision_deliverables.py"
export-juliane = "python scripts/14_export_juliane_package.py"
build-web-figures = "python scripts/13_build_web_figures.py"
build-reviewer-workbook = "python scripts/15_build_reviewer_response_workbook.py"
